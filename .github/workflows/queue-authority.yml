name: Queue authority
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  queue-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:queue-authority
      - run: pnpm check:queue-authority
