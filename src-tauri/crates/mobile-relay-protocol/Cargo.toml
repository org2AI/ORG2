[package]
name = "mobile-relay-protocol"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Shared wire types for ORGII Mobile Remote relay and desktop client"

[lib]
name = "mobile_relay_protocol"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { workspace = true, optional = true }

[features]
contract-export = ["dep:schemars"]

[[example]]
name = "export_contract"
required-features = ["contract-export"]
