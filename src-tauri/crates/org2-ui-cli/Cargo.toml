[package]
name = "org2_ui_cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "org2-ui"
path = "src/main.rs"

[dependencies]
app_ui = { path = "../app-ui" }
app_paths = { path = "../app-paths" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
uuid = { version = "1", features = ["v4"] }
